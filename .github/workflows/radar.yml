name: Radar

on:
  schedule:
    # Werktags 04:17 UTC (05:17 Winterzeit, 06:17 Sommerzeit)
    - cron: "17 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Abhängigkeit für die Verschlüsselung installieren
        run: pip install --quiet --disable-pip-version-check cryptography

      # Zwischenspeicher und verschlüsselter Bestand vom letzten Lauf.
      # Enthält öffentliche Rohdaten und nur verschlüsselte Treffer.
      - name: Arbeitsdaten wiederherstellen
        uses: actions/cache/restore@v6
        with:
          path: daten
          key: radar-daten-${{ github.run_id }}
          restore-keys: radar-daten-

      - name: Radar ausführen
        env:
          RADAR_PROFIL: ${{ secrets.RADAR_PROFIL }}
          RADAR_PASSWORT: ${{ secrets.RADAR_PASSWORT }}
        run: python radar.py --ausgabe seite/index.html

      - name: Arbeitsdaten sichern
        if: always() && hashFiles('daten/**') != ''
        uses: actions/cache/save@v6
        with:
          path: daten
          key: radar-daten-${{ github.run_id }}

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: seite

      - name: Seite veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v5

      # GitHub pausiert Zeitpläne in öffentlichen Repositories nach 60 Tagen
      # ohne Aktivität. Das erneute Aktivieren soll das verhindern.
      - name: Zeitplan aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable radar.yml --repo "${{ github.repository }}"
